<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sheet-preview</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--panel:#fff;--line:#d0d5dd;--text:#1d2430;--mute:#667085;--accent:#2563eb;--sel:rgba(37,99,235,.18);--head:#eef1f5;--warn:#fff4ce;--ext:#f5f6f8}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:2px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0}
.badge{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mute)}
.badge.ok{color:#1a7f4b;border-color:#1a7f4b}.badge.ng{color:#b54708;border-color:#b54708}
#toolbar{display:flex;align-items:center;gap:4px;padding:3px 8px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#toolbar button,button.b{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:2px 9px;border-radius:6px;cursor:pointer}
#toolbar button:hover,button.b:hover{background:var(--head)}
button.b.p,#toolbar button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:default}
.sw{display:inline-block;width:12px;height:12px;border:1px solid var(--line);vertical-align:-1px;margin-right:3px}
#banner{display:none;padding:4px 10px;background:var(--warn);border-bottom:1px solid var(--line);font-size:13px}
#banner.on{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
main{flex:1;display:flex;min-height:0}
#left{flex:1;display:flex;flex-direction:column;min-width:0}
#gridhost{flex:1;position:relative;min-height:0;margin:4px 4px 0}
#gridwrap{position:absolute;inset:0;overflow:auto;background:var(--panel);border:1px solid var(--line);user-select:none}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
td,th{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:clip;position:relative;color:#111}
td{background:#fff}
th{background:var(--head);color:var(--mute);font-weight:500;text-align:center;font-size:12px;position:sticky;top:0;z-index:2;cursor:pointer}
th.rh{left:0;z-index:3}
th.corner{left:0;top:0;z-index:5}
th.sel{background:#c7d7f7;color:#111}
th.drop-l{box-shadow:inset 3px 0 0 var(--accent)}th.drop-r{box-shadow:inset -3px 0 0 var(--accent)}
th.drop-t{box-shadow:inset 0 3px 0 var(--accent)}th.drop-b{box-shadow:inset 0 -3px 0 var(--accent)}
.fr-last{border-bottom:2px solid #667085!important}.fc-last{border-right:2px solid #667085!important}
.rz-c{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:6}
.rz-r{position:absolute;left:0;bottom:-3px;height:7px;width:100%;cursor:row-resize;z-index:6}
td.sel::after{content:"";position:absolute;inset:0;background:var(--sel);outline:1px solid var(--accent);outline-offset:-1px;pointer-events:none}
.k-todo{--kc:#f59e0b}.k-wait{--kc:#ef4444}.k-ask{--kc:#8b5cf6}.k-memo{--kc:#667085}.k-done{--kc:#22a06b}
td.tri::before,th.corner.tri::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 11px 11px 0;border-color:transparent var(--kc) transparent transparent;z-index:1;pointer-events:none}
td.tri.k-wait::before,th.corner.tri.k-wait::before{border-width:0 15px 15px 0}
td.tri.k-wait{box-shadow:inset 0 0 0 2px var(--kc)}
td.hl{box-shadow:inset 0 0 0 3px #ef4444}
#ov{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:10}
#ov svg{position:absolute;inset:0;width:100%;height:100%}
.bubble{position:absolute;width:260px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--kc,#f59e0b);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:6px 8px;pointer-events:auto;font-size:13px}
.bubble.new{border-left-color:var(--accent)}.bubble.k-wait{background:linear-gradient(rgba(239,68,68,.1),rgba(239,68,68,.1)),var(--panel)}
.bubble .msgs{max-height:220px;overflow:auto}
.bubble textarea{min-height:44px}
.bubble.active{box-shadow:0 0 0 2px var(--accent),0 4px 14px rgba(0,0,0,.18)}
.msg{white-space:pre-wrap;margin:4px 0;padding-left:8px;border-left:3px solid var(--line)}
.msg.agent{border-left-color:#22a06b}.msg.human{border-left-color:var(--accent)}
.msg .who{display:block;font-size:11px;color:var(--mute)}
.kd{font-size:11px;padding:0 6px;border-radius:8px;border:1px solid var(--kc,var(--line));color:var(--kc,var(--mute))}
.bubble .x{float:right;cursor:pointer;color:var(--mute);border:none;background:none;font-size:16px;line-height:1;padding:0 2px}
#editor{position:absolute;z-index:20;font:inherit;color:#111;background:#fff;border:2px solid var(--accent);border-radius:0;padding:2px 6px;resize:none;min-height:0;overflow:auto}
#tabs{display:flex;align-items:flex-end;gap:2px;padding:0 4px 3px;overflow-x:auto;flex:none}
#ftabs{display:flex;align-items:flex-end;gap:2px;padding:4px 8px 0;background:var(--head);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
#ftabs .ft{border:1px solid var(--line);border-bottom:none;background:var(--bg);color:var(--mute);padding:3px 14px;border-radius:6px 6px 0 0;cursor:pointer;font:inherit;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#ftabs .ft.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
#ftabs .ft .dot{color:#d9480f;margin-left:4px}
#ftabs input{width:260px;padding:1px 6px;margin-bottom:2px}
td.ext{background:var(--ext)}
th.ext{opacity:.55}
td.ext.sel{background:var(--ext)}
#split{width:5px;cursor:col-resize;flex:none;background:var(--line);opacity:.5}
#split:hover{opacity:1;background:var(--accent)}
body.nopane #right,body.nopane #split{display:none}
#tabs .tab{border:1px solid var(--line);border-top:none;background:var(--head);color:var(--text);padding:3px 14px;border-radius:0 0 6px 6px;cursor:pointer;font:inherit;white-space:nowrap}
#tabs .tab.on{background:var(--panel);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
#tabs .tab.over{outline:2px solid var(--accent)}
#tabs input{width:110px;padding:1px 4px}
#menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.22);padding:4px;min-width:180px;display:none}
#menu div{padding:4px 12px;cursor:pointer;border-radius:4px;white-space:nowrap}
#menu div:hover{background:var(--head)}
#menu div.dis{opacity:.4;pointer-events:none}
#menu hr{border:none;border-top:1px solid var(--line);margin:3px 0}
#pal{position:fixed;z-index:51;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.22);padding:8px;display:none;width:178px}
#pal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#pal .g i{height:20px;border:1px solid var(--line);border-radius:3px;cursor:pointer}
#right{width:300px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#right section{padding:6px 8px;border-bottom:1px solid var(--line)}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:2px}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
#list{flex:1;overflow:auto;padding:0}
.item{padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-left:4px solid var(--kc,transparent)}
.item.k-wait{background:rgba(239,68,68,.10)}
.item:hover{background:var(--head)}
.item.on{border-left-color:var(--accent);background:var(--head)}
.item.gone{opacity:.65}
.item .r{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent)}
.item textarea{min-height:40px}
.st{font-size:11px;padding:0 6px;border-radius:8px;margin-left:6px}
.st.未対応{background:#fef0c7;color:#93370d}.st.対応済,.st.解決{background:#d1fadf;color:#05603a}.st.質問{background:#ebe9fe;color:#5925dc}.st.削除{background:#fee4e2;color:#b42318}.st.確認待ち{background:#fee4e2;color:#b42318;font-weight:700}
.badge.wait{color:#b42318;border-color:#b42318;background:#fee4e2;cursor:pointer;font-weight:700}
#ftabs .ft .dot.w{color:#b42318;font-weight:700}
#ftabs .ft .cx{margin-left:6px;color:var(--mute);cursor:pointer}#ftabs .ft .cx:hover{color:var(--text)}
#ftabs .ft.home{font-weight:600}
#listview{display:none;flex:1;overflow:auto;padding:10px 14px;min-height:0}
body.listmode #listview{display:block}
body.listmode header,body.listmode #toolbar,body.listmode #banner,body.listmode main{display:none}
#listview .note{padding:6px 10px;border-radius:6px;background:var(--warn);margin-bottom:8px;font-size:13px}
#listview .ctl{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
#listview .ctl input{width:260px}#listview .ctl select{width:auto}
#listview table{width:100%;table-layout:auto;border:1px solid var(--line);background:var(--panel)}
#listview th{position:static;background:var(--head);text-align:left;cursor:default;font-size:12px}
#listview td{background:var(--panel);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
#listview tr.row-f{cursor:pointer}#listview tr.row-f:hover td{background:var(--head)}
#listview tr.miss td{opacity:.6}
#listview td.num{text-align:right}
#listview h2{font-size:14px;margin:14px 0 4px}
.hint{font-size:12px;color:var(--mute)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d2430;color:#fff;padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
@media (max-width:800px){main{flex-direction:column}#right{width:auto!important;border-left:none;border-top:1px solid var(--line);max-height:45vh}#split{display:none}}
</style>
</head>
<body>
<div id="ftabs"></div>
<header>
  <h1 id="title"></h1>
  <span class="badge" id="mode"></span>
  <span class="badge" id="conn"></span>
  <span class="badge" id="dirty" style="display:none">未保存</span>
  <span class="badge wait" id="waitBadge" style="display:none" title="確認待ちのスレッド。クリックで絞り込み"></span>
  <span style="flex:1"></span>
  <button class="b" id="tPane" title="右のコメント一覧パネルを折りたたむ / 開く">一覧 ▸</button>
  <button class="b" id="reload" title="sheet.json と review.json を読み直す（画面の未保存の変更は失われる）">再読み込み</button>
</header>
<div id="toolbar">
  <button id="tUndo" title="元に戻す (Ctrl+Z)">元に戻す</button><button id="tRedo" title="やり直し (Ctrl+Shift+Z)">やり直し</button>
  <span class="sep"></span>
  <button id="tBold" title="太字"><b>B</b></button>
  <button data-align="left" title="左寄せ">左</button><button data-align="center" title="中央">中</button><button data-align="right" title="右寄せ">右</button>
  <button id="tBg" title="背景色"><span class="sw" style="background:#dbe5f1"></span>背景</button>
  <button id="tFg" title="文字色"><span class="sw" style="background:#c92a2a"></span>文字</button>
  <span class="sep"></span>
  <button id="tMerge">結合</button><button id="tUnmerge">結合解除</button>
  <span class="sep"></span>
  <button id="tRow">行 ▾</button><button id="tCol">列 ▾</button><button id="tFreeze">固定 ▾</button>
  <span class="sep"></span>
  <button id="tComment" title="選択範囲へのコメント（エージェントへの指示）">コメント</button>
  <span style="flex:1"></span>
  <label style="display:inline-flex;gap:4px;align-items:center;margin:0 6px"><input type="checkbox" id="showAll" style="width:auto">吹き出しを全部表示</label>
  <button class="p" id="save" title="Ctrl+S">保存</button>
  <button id="copySheet">sheet.json をコピー</button>
  <button id="copy">指示をコピー</button>
</div>
<div id="banner"></div>
<div id="listview"><div id="lvNote"></div><div class="ctl"><input id="lvQ" placeholder="検索（タスク・ファイル名・パス）"><select id="lvTask"></select><span id="lvInfo" class="hint"></span></div><div id="lvTable"></div><div id="lvTrash"></div></div>
<main>
  <div id="left">
    <div id="gridhost">
      <div id="gridwrap"><table id="grid"></table></div>
      <div id="ov"><svg id="lines"></svg></div>
    </div>
    <div id="tabs"></div>
  </div>
  <div id="split" title="ドラッグで一覧パネルの幅を変える"></div>
  <aside id="right">
    <section>
      <label>選択範囲（ドラッグ / Shift で拡張 / Ctrl・Cmd で追加。見出しクリックで列・行ごと）</label>
      <input id="range" placeholder="例: 明細!B2:D5, F3（直接入力もできる）">
      <label style="margin-top:8px">スレッドを追加（指示 = 直してほしい / 確認 = 聞きたい / メモ。セルの文字を直接直すときは、セルをダブルクリック）</label>
      <textarea id="instr" placeholder="この範囲について"></textarea>
      <div class="row"><select id="kind" style="width:auto"><option>指示</option><option>確認</option><option>メモ</option></select><button class="b p" id="add">追加</button><span class="hint" id="selinfo"></span></div>
    </section>
    <section>
      <div class="row" style="margin-top:0">
        <span class="hint">スレッド一覧</span>
        <select id="filter" style="width:auto"><option value="">すべて</option><option value="確認待ち">確認待ち</option><option value="open">未解決</option><option value="未対応">未対応</option><option value="対応済">対応済</option><option value="解決">解決</option><option value="kind:指示">指示</option><option value="kind:確認">確認</option><option value="kind:メモ">メモ</option></select>
      </div>
      <div class="hint" id="savemsg" style="margin-top:4px"></div>
    </section>
    <div id="list"></div>
  </aside>
</main>
<div id="menu"></div>
<div id="pal"></div>
<div id="toast"></div>
<script>
const BOOT = /*__BOOT__*/null;
// 表示中のファイルの状態はグローバル（sheet / review / base / dirty / saved / undoStack ...）に持ち、
// 切り替えるときだけ FILES の各エントリへ退避・復元する。ファイルごとに独立。
let sheet, review, serverOk = !!BOOT.server;
let base = { sheet: null, review: null };
let dirty = { sheet: false, review: false };
let conflictNow = null; // 表示中のファイルで検知した外部更新（["sheet.json", ...]）
const FILES = new Map(); // key -> 状態
let curKey = null, busy = false, listMode = false;
let rev = { sheet: 0, review: 0 };
const lsKey = (k) => "sheet-preview:v2:" + k;
const $ = (id) => document.getElementById(id);
// 日本語入力（IME）の変換中・確定直後のキーか。Safari/WKWebView は compositionend が keydown より先に来て isComposing が false になるため、直後 80ms も変換の一部として扱う
let imeOn = false, imeEndAt = -1e9;
window.addEventListener("compositionstart", () => { imeOn = true; }, true);
window.addEventListener("compositionend", () => { imeOn = false; imeEndAt = performance.now(); }, true);
const imeKey = (e) => e.isComposing || imeOn || e.keyCode === 229 || performance.now() - imeEndAt < 80;
const tryLS = (fn) => { try { return fn(); } catch { return undefined; } };
const esc = (s) => String(s).replace(/[&<>"]/g, (x) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[x]));
const HDR_H = 24, RH_W = 44;

// ---- A1 ヘルパー ----
const colName = (n) => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const colNum = (s) => [...s].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0);
const parseAddr = (a) => { const m = /^([A-Za-z]+)(\d+)$/.exec(a.trim()); return m ? { c: colNum(m[1].toUpperCase()), r: +m[2] } : null; };
const parseRect = (t) => {
  const [a, b] = t.split(":"); const p = parseAddr(a), q = parseAddr(b ?? a);
  if (!p || !q) return null;
  return { r1: Math.min(p.r, q.r), c1: Math.min(p.c, q.c), r2: Math.max(p.r, q.r), c2: Math.max(p.c, q.c) };
};
// 列・行そのものの範囲（B:D / 2:4）。保存は行数・列数に依存しない形（INF）、画面上の選択は実際の大きさ（ax フラグで書式を保つ）
const AXMAX_R = 1048576, AXMAX_C = 16384;
const parseRectAx = (t) => {
  let m = /^([A-Za-z]+):([A-Za-z]+)$/.exec(t.trim());
  if (m) { const a = colNum(m[1].toUpperCase()), b = colNum(m[2].toUpperCase()); return { r1: 1, c1: Math.min(a, b), r2: AXMAX_R, c2: Math.max(a, b), ax: "col" }; }
  m = /^(\d+):(\d+)$/.exec(t.trim());
  if (m) { const a = +m[1], b = +m[2]; return { r1: Math.min(a, b), c1: 1, r2: Math.max(a, b), c2: AXMAX_C, ax: "row" }; }
  return parseRect(t);
};
const plainRect = (x) => ({ r1: x.r1, c1: x.c1, r2: x.r2, c2: x.c2 });
function clipRect(x, sh) { if (!x || !x.ax) return x; const { R, C } = dims(sh); return x.ax === "col" ? { ...x, r2: Math.min(x.r2, R) } : { ...x, c2: Math.min(x.c2, C) }; }
const rectText = (x) => x.ax === "col" ? colName(x.c1) + ":" + colName(x.c2) : x.ax === "row" ? x.r1 + ":" + x.r2
  : (x.r1 === x.r2 && x.c1 === x.c2) ? colName(x.c1) + x.r1 : colName(x.c1) + x.r1 + ":" + colName(x.c2) + x.r2;
const quoteSheet = (n) => /^[A-Za-z0-9_぀-ヿ一-鿿]+$/.test(n) ? n : "'" + n.replace(/'/g, "''") + "'";
// "明細!B2:D5, F3, 集計!A1" -> パーツ列 [{sheet, rect|null, raw}]。解釈できないパーツは rect:null で残す
function splitRanges(text) {
  const out = []; let cur = null;
  for (let part of text.split(",")) {
    part = part.trim(); if (!part) continue;
    const m = /^(?:'((?:[^']|'')+)'|([^!']+))!(.+)$/.exec(part);
    if (m) { cur = m[1] ? m[1].replace(/''/g, "'") : m[2]; part = m[3]; }
    if (part === "*") { out.push({ sheet: m ? cur : null, rect: null, star: true, raw: "*" }); continue; } // * = 全シート / Sheet!* = そのシート全体
    out.push({ sheet: cur ?? sheet.sheets[0].name, rect: parseRectAx(part), raw: part });
  }
  return out;
}
// 星（全体への確認）は左上セルに目印を出す
const anchorRect = (p) => p.star ? { r1: 1, c1: 1, r2: 1, c2: 1 } : p.rect && p.rect.ax === "col" ? { r1: 1, c1: p.rect.c1, r2: 1, c2: p.rect.c1 } : p.rect && p.rect.ax === "row" ? { r1: p.rect.r1, c1: 1, r2: p.rect.r1, c2: 1 } : p.rect;
const partOnSheet = (p, name) => p.star ? (p.sheet === null || p.sheet === name) : p.sheet === name;
const parseRanges = (text) => splitRanges(text).filter((p) => p.rect);
function joinRanges(parts) {
  let last = null, out = [];
  for (const p of parts) {
    if (p.star && p.sheet === null) { out.push("*"); continue; }
    const t = p.rect ? rectText(p.rect) : p.raw; out.push((p.sheet !== last ? quoteSheet(p.sheet) + "!" : "") + t); last = p.sheet;
  }
  return out.join(", ");
}

// ---- シート構造 ----
let cur = 0; // 表示中シート index
const curSheet = () => sheet.sheets[cur];
function dims(sh) {
  let maxR = 0, maxC = 0;
  const note = (r, c) => { if (r > maxR) maxR = r; if (c > maxC) maxC = c; };
  for (const a of Object.keys(sh.cells || {})) { const p = parseAddr(a); if (p) note(p.r, p.c); }
  for (const m of sh.merges || []) { const x = parseRect(m); if (x) note(x.r2, x.c2); }
  for (const k of Object.keys(sh.colWidths || {})) note(0, colNum(k));
  for (const k of Object.keys(sh.rowHeights || {})) note(+k, 0);

function setFavicon(task) {
  const col = task ? `hsl(${hueOf(task)} 65% 45%)` : "#6b7280";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="${col}"/><path d="M7 10h18M7 16h18M7 22h18M13 8v16M19 8v16" stroke="#fff" stroke-width="2" fill="none"/></svg>`;
  let l = document.querySelector('link[rel="icon"]'); if (!l) { l = document.createElement("link"); l.rel = "icon"; document.head.appendChild(l); }
  const href = "data:image/svg+xml," + encodeURIComponent(svg); if (l.getAttribute("href") !== href) l.setAttribute("href", href);
}
const threadsOf = (k) => (k === curKey ? review : FILES.get(k).review).threads;
const totalWait = () => [...FILES.keys()].reduce((n, k) => n + threadsOf(k).filter(isWait).length, 0);
const baseName = (k) => String(k).split(/[\\/]/).pop();
function updateTitle() {
  const n = totalWait(), pre = (anyDirty() ? "● " : "") + (n ? `(${n}) ` : "");
  if (listMode || !curKey) { document.title = pre + "sheet-preview 一覧"; setFavicon(""); }
  else { const st = FILES.get(curKey), task = (st && st.task) || BOOT.task || ""; document.title = pre + (task ? `[${task}] ` : "") + baseName(curKey) + " - sheet-preview"; setFavicon(task); }
  const wb = $("waitBadge"); if (wb) { const w = curKey && !listMode && review ? waitCount() : 0; wb.style.display = w ? "" : "none"; wb.textContent = "確認待ち " + w; }
}
$("waitBadge").onclick = () => { setPane(true, null); $("filter").value = "確認待ち"; renderList(); };

// ---- ファイルタブ（最上部） ----
function newState(f) {
  const fr = f.rev || { sheet: 0, review: 0 }, fv = f.ver || {};
  const st = { key: f.key, task: f.task || "", title: f.title || "", sheet: stripRev(f.sheet), review: { threads: (f.review && f.review.threads) || [] },
    base: { sheet: fv.sheet, review: fv.review }, rev: { sheet: fr.sheet, review: fr.review },
    dirty: { sheet: false, review: false }, saved: { sheet: JSON.stringify(stripRev(f.sheet)), review: JSON.stringify((f.review && f.review.threads) || []) },
    undoStack: [], redoStack: [], cur: 0, rects: [], anchor: null, activeId: null, composer: null, conflict: null };
  // 下書き（localStorage）の復元。読み込んだ版が同じときだけ戻す（エージェントの更新を握りつぶさない）
  const d = tryLS(() => JSON.parse(localStorage.getItem(lsKey(f.key))));
  if (d && d.sheet && d.review && Array.isArray(d.review.threads) && d.dirty && (d.dirty.sheet || d.dirty.review) && d.base && d.base.sheet === st.base.sheet && d.base.review === st.base.review) {
    st.sheet = stripRev(d.sheet); st.review = { threads: d.review.threads }; st.dirty = d.dirty; st.restored = true;
  }
  return st;
}
function stash() { // 表示中の状態をエントリへ退避
  const st = FILES.get(curKey); if (!st) return;
  st.sheet = sheet; st.review = review; st.base = base; st.rev = rev; st.dirty = dirty; st.saved = saved; st.undoStack = undoStack; st.redoStack = redoStack;
  st.cur = cur; st.rects = rects; st.anchor = anchor; st.activeId = activeId; st.composer = composer; st.conflict = conflictNow;
}
function bind(st) {
  sheet = st.sheet; review = st.review; base = st.base; rev = st.rev; dirty = st.dirty; saved = st.saved; undoStack = st.undoStack; redoStack = st.redoStack;
  cur = st.cur; rects = st.rects; anchor = st.anchor; activeId = st.activeId; composer = st.composer;
}
function loadState(key) { // エントリをグローバルへ
  const st = FILES.get(key); curKey = key; bind(st); hlRanges = [];
  hideMenu(); hidePal(); $("range").value = ""; $("instr").value = "";
  if (st.conflict) showConflict(st.conflict); else banner("");
  $("savemsg").textContent = "";
}
function adopt(key) {
  if (key === curKey && !listMode) return; if (busy) return toast("保存中です");
  if (!listMode) { endEdit(true); persist(); stash(); }
  listMode = false; document.body.classList.remove("listmode");
  loadState(key); persist(); render(); setTimeout(layoutBubbles, 0); heartbeat(false);
}
const fdirty = (key) => { const d = key === curKey ? dirty : FILES.get(key).dirty; return d.sheet || d.review; };
function closeTab(key) {
  if (fdirty(key) && !confirm("未保存の変更があります。閉じると破棄されます（下書きはブラウザに残ります）。閉じますか？")) return;
  const wasCur = key === curKey, keys = [...FILES.keys()], i = keys.indexOf(key);
  if (wasCur) { endEdit(false); persist(); }
  FILES.delete(key);
  if (wasCur) { curKey = null; const next = keys[i + 1] || keys[i - 1]; if (next && next !== key) { listMode = true; adopt(next); } else showList(true); }
  renderFTabs(); heartbeat(true);
}
function renderFTabs() {
  const t = $("ftabs"); if (!t) return; t.innerHTML = "";
  if (BOOT.hub) { const h = document.createElement("button"); h.className = "ft home" + (listMode ? " on" : ""); h.textContent = "一覧"; h.title = "登録されているファイルの一覧"; h.onclick = () => showList(); t.appendChild(h); }
  const names = [...FILES.keys()].map(baseName);
  for (const key of FILES.keys()) {
    const st = FILES.get(key), nm = baseName(key), dup = names.filter((x) => x === nm).length > 1;
    const b = document.createElement("button"); b.className = "ft" + (!listMode && key === curKey ? " on" : ""); b.dataset.key = key; b.title = key;
    b.appendChild(document.createTextNode((dup && st.task ? `[${st.task}] ` : "") + nm));
    const w = threadsOf(key).filter(isWait).length;
    if (w) { const s = document.createElement("span"); s.className = "dot w"; s.textContent = `(${w})`; s.title = "確認待ち " + w + " 件"; b.appendChild(s); }
    if (fdirty(key)) { const s = document.createElement("span"); s.className = "dot"; s.textContent = "●"; s.title = "未保存"; b.appendChild(s); }
    if (key === curKey ? conflictNow : st.conflict) { const s = document.createElement("span"); s.className = "dot"; s.textContent = "⚠"; s.title = "ファイルが外部で更新されています"; b.appendChild(s); }
    if (BOOT.hub) { const x = document.createElement("span"); x.className = "cx"; x.textContent = "×"; x.title = "タブを閉じる"; x.onclick = (e) => { e.stopPropagation(); closeTab(key); }; b.appendChild(x); }
    b.onclick = () => adopt(key); t.appendChild(b);
  }
  if (BOOT.server) { const a = document.createElement("button"); a.className = "ft"; a.id = "ftAdd"; a.textContent = "+"; a.title = "別の *.sheet.json を追加（パス入力。無ければ新規作成。フォルダも可）"; a.onclick = addFile; t.appendChild(a); }
  updateTitle();
}
function addFile() {
  const a = $("ftAdd"); if (!a) return; const inp = document.createElement("input"); inp.placeholder = "追加する .sheet.json のパス（無ければ新規作成）/ フォルダ"; inp.id = "ftInput";
  a.replaceWith(inp); inp.focus(); let done = false;
  const fin = async (ok) => { if (done) return; done = true; const p = inp.value.trim(); if (!ok || !p) return renderFTabs();
    try { const { j } = await post("/api/open", { path: p });
      if (!j.ok) { toast(j.error || "追加できません"); return renderFTabs(); }
      for (const key of j.keys) if (!FILES.has(key)) FILES.set(key, newState(await getFile(key)));
      renderFTabs(); if (j.keys.length) adopt(j.keys[0]); toast(j.created ? "新規作成: " + j.keys[0] : "追加しました");
    } catch (e) { toast("サーバに接続できません"); renderFTabs(); } };
  inp.onkeydown = (e) => { if (e.key !== "Escape" && imeKey(e)) { e.stopPropagation(); return; } if (e.key === "Enter") fin(true); else if (e.key === "Escape") fin(false); e.stopPropagation(); };
  inp.onblur = () => fin(false);
}

// ---- 一覧タブ（ハブのホーム）----
let LIST = null, listBusy = false, listT = null;
const fmtDT = (s) => { if (!s) return ""; const d = new Date(s); if (isNaN(d)) return ""; const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear() === new Date().getFullYear() ? "" : d.getFullYear() + "/"}${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function showList(force) {
  if (!BOOT.hub) return; if (listMode && !force) return; if (busy) return toast("保存中です");
  if (curKey) { endEdit(true); persist(); stash(); }
  listMode = true; curKey = null; document.body.classList.add("listmode"); renderFTabs(); refreshList(); heartbeat(false);
}
const refreshListSoon = () => { if (listMode) { clearTimeout(listT); listT = setTimeout(refreshList, 200); } };
async function refreshList() {
  if (!BOOT.hub || listBusy) return; listBusy = true;
  try { LIST = await (await fetch("/api/list", { cache: "no-store" })).json(); } catch { /* 前回のまま */ }
  listBusy = false; renderListView();
}
async function openFromList(key) {
  try { if (!FILES.has(key)) FILES.set(key, newState(await getFile(key))); adopt(key); } catch { toast("開けません"); }
}
function renderListView() {
  if (!listMode || !LIST) return;
  const note = $("lvNote"); const c = LIST.cleanup, parts = [];
  if (c && c.moved && c.moved.length) parts.push(`<div class="note"><b>${c.moved.length} 件を整理（ごみ箱へ）</b> ${fmtDT(c.at)}。${LIST.retentionDays} 日更新のなかった登録ファイルを移しました: ${c.moved.map((m) => esc(String(m.path).split("/").pop())).join(", ")}。元に戻すには下の「ごみ箱」から。</div>`);
  if (c && c.purged) parts.push(`<div class="note">ごみ箱で ${LIST.retentionDays} 日を過ぎた ${c.purged} 件を完全に削除しました。</div>`);
  if (!LIST.cleanupEnabled) parts.push(`<div class="note">自動整理は停止中（--no-cleanup）。</div>`);
  parts.push(`<div class="hint">${LIST.retentionDays} 日更新のない登録ファイルは、この一覧を開いたときに ${esc(LIST.trash.dir)} へ移されます。大事なものは別の場所にコピーするか、xlsx に変換してください。</div>`);
  note.innerHTML = parts.join("");
  const files = LIST.files, tasks = [...new Set(files.map((f) => f.task).filter(Boolean))].sort(), sel = $("lvTask");
  if (sel.dataset.sig !== tasks.join("\n")) { const cur0 = sel.value; sel.innerHTML = `<option value="">すべてのタスク</option>` + tasks.map((t) => `<option>${esc(t)}</option>`).join(""); sel.value = tasks.includes(cur0) ? cur0 : ""; sel.dataset.sig = tasks.join("\n"); }
  const q = $("lvQ").value.trim().toLowerCase(), tk = sel.value;
  const rows = files.filter((f) => (!tk || f.task === tk) && (!q || [f.task, f.name, f.path, f.title].join("\n").toLowerCase().includes(q))).sort((a, b) => String(b.updated || "").localeCompare(String(a.updated || "")));
  $("lvInfo").textContent = `${rows.length} / ${files.length} 件`;
  let h = `<table><thead><tr><th>タスク</th><th>ファイル名</th><th>パス</th><th>作成</th><th>更新</th><th>確認待ち</th><th>状態</th></tr></thead><tbody>`;
  for (const f of rows) {
    const ok = f.state === "ok", left = f.expires_at ? Math.ceil((new Date(f.expires_at) - new Date(LIST.now)) / 86400000) : null;
    const state = ok ? (left !== null && left <= 2 ? `あと ${Math.max(left, 0)} 日で整理` : "ok") : f.state === "missing" ? `見つからない <button class="b" data-rm="${esc(f.path)}">登録から外す</button>` : `読めない <button class="b" data-rm="${esc(f.path)}">登録から外す</button>`;
    h += `<tr class="${ok ? "row-f" : "miss"}" data-key="${esc(f.key)}"><td>${esc(f.task || "")}</td><td>${esc(f.name)}</td><td title="${esc(f.path)}">${esc(f.path)}</td><td>${fmtDT(f.created)}</td><td>${fmtDT(f.updated)}</td><td class="num">${f.unanswered ? `<span class="badge wait">${f.unanswered}</span>` : ""}</td><td>${state}</td></tr>`;
  }
  $("lvTable").innerHTML = h + (rows.length ? "" : `<tr><td colspan="7" class="hint">該当するファイルがありません。</td></tr>`) + "</tbody></table>";
  $("lvTable").querySelectorAll("tr.row-f").forEach((tr) => { tr.onclick = () => openFromList(tr.dataset.key); });
  $("lvTable").querySelectorAll("[data-rm]").forEach((b) => { b.onclick = async (e) => { e.stopPropagation(); const { j } = await post("/api/registry/remove", { path: b.dataset.rm }); toast(j.ok ? "登録から外しました" : j.error || "失敗"); refreshList(); }; });
  const tr = LIST.trash.items;
  let t = `<h2>ごみ箱（${esc(LIST.trash.dir)}）</h2><div class="hint">${LIST.retentionDays} 日を過ぎたものは完全に削除されます。</div>`;
  if (!tr.length) t += `<div class="hint">空です。</div>`;
  else { t += `<table><thead><tr><th>タスク</th><th>元のパス</th><th>整理した日時</th><th></th></tr></thead><tbody>` + tr.map((x) => `<tr><td>${esc(x.task || "")}</td><td title="${esc(x.path)}">${esc(x.path)}</td><td>${fmtDT(x.at)}</td><td><button class="b" data-rs="${esc(x.id)}">元に戻す</button></td></tr>`).join("") + "</tbody></table>"; }
  $("lvTrash").innerHTML = t;
  $("lvTrash").querySelectorAll("[data-rs]").forEach((b) => { b.onclick = async () => { const { j } = await post("/api/trash/restore", { id: b.dataset.rs }); toast(j.ok ? "元に戻しました: " + j.path : j.error || "失敗"); refreshList(); }; });
}
$("lvQ").oninput = renderListView; $("lvTask").onchange = renderListView;

// ---- 一覧パネルの開閉・幅 ----
const PANE_KEY = "sheet-preview:pane";
function setPane(open, w, save) {
  document.body.classList.toggle("nopane", !open); $("tPane").textContent = open ? "一覧 ◂" : "一覧 ▸";
  if (w) $("right").style.width = w + "px";
  if (save !== false) tryLS(() => localStorage.setItem(PANE_KEY, JSON.stringify({ open, w: parseInt($("right").style.width) || 300 })));
  setTimeout(layoutBubbles, 0);
}
$("tPane").onclick = () => setPane(document.body.classList.contains("nopane"));
(function () { const p = tryLS(() => JSON.parse(localStorage.getItem(PANE_KEY))); if (p) setPane(p.open !== false, p.w, false); else setPane(true, 300, false); })();
$("split").addEventListener("mousedown", (e) => { e.preventDefault(); const mv = (ev) => { const w = Math.max(200, Math.min(innerWidth * 0.7, innerWidth - ev.clientX)); $("right").style.width = w + "px"; layoutBubbles(); };
  const up = () => { window.removeEventListener("mousemove", mv); window.removeEventListener("mouseup", up); setPane(true, null); };
  window.addEventListener("mousemove", mv); window.addEventListener("mouseup", up); });
// 画面サイズが変わったら、空きグリッドを画面いっぱいに足し直す
let rzT = null;
let rzSize = "";
function refit() { clearTimeout(rzT); rzT = setTimeout(() => {
  const w = $("gridwrap"), sz = w.clientWidth + "x" + w.clientHeight; if (sz === rzSize) return;
  if (editing || drag) return refit(); // 編集・ドラッグ中は終わってからやり直す
  rzSize = sz; if (sheet && !listMode && curKey) render(); }, 60); }
const rzo = new ResizeObserver(refit); rzo.observe($("gridhost")); rzo.observe($("gridwrap")); rzo.observe(document.documentElement);
window.addEventListener("resize", refit); // 親（アプリのペイン境界）の移動を ResizeObserver が取りこぼしても拾う

// 起動時: 下書き（localStorage）の復元。読み込んだ版が同じときだけ戻す（エージェントの更新を握りつぶさない）
(function boot() {
  for (const f of BOOT.files) FILES.set(f.key, newState(f));
  setConn();
  if (BOOT.files.length) {
    loadState(BOOT.files[0].key);
    if ([...FILES.values()].some((st) => st.restored)) toast("未保存の下書きを復元しました");
    render(); renderFTabs();
  } else { listMode = true; document.body.classList.add("listmode"); renderFTabs(); }
  if (BOOT.hub) { heartbeat(true); if (listMode || true) { LIST = { now: new Date().toISOString(), retentionDays: BOOT.retentionDays, cleanupEnabled: true, cleanup: BOOT.cleanup, trash: { dir: (BOOT.home || "") + "/trash", items: [] }, files: [] }; if (listMode) refreshList(); } }
})();
</script>
</body>
