schema_version: "1.1"
name: concurrent-writes
expected_outcome: |
  稼働中のハブに対して、sheet.json をファイルへ直接上書きせず PATCH API（または lock + tmp/rename + rev+1）で書いている。
  409 が返ったら GET し直して再送し、人の変更を上書きしていない。
